name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: KPI

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -oP '__version__ = "\K[^"]+' kiro_proxy/__init__.py)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build binary
        run: python build.py
        
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libfuse2
          sudo gem install --no-document fpm
          
      - name: Create packages
        run: |
          mkdir -p release
          VERSION=${{ steps.version.outputs.VERSION }}
          
          # Binary (standalone)
          cp dist/KPI release/KPI-${VERSION}-linux-x86_64
          chmod +x release/KPI-${VERSION}-linux-x86_64
          
          # tar.gz
          tar -czvf release/KPI-${VERSION}-linux-x86_64.tar.gz -C dist KPI
          
          # deb package
          fpm -s dir -t deb \
            -n kpi \
            -v ${VERSION} \
            --description "Kiro API Proxy Server" \
            --license "MIT" \
            --architecture amd64 \
            --maintainer "petehsu" \
            --url "https://github.com/petehsu/KiroProxy" \
            -p release/kpi_${VERSION}_amd64.deb \
            dist/KPI=/usr/local/bin/kpi
          
          # rpm package
          fpm -s dir -t rpm \
            -n kpi \
            -v ${VERSION} \
            --description "Kiro API Proxy Server" \
            --license "MIT" \
            --architecture x86_64 \
            --maintainer "petehsu" \
            --url "https://github.com/petehsu/KiroProxy" \
            -p release/kpi-${VERSION}-1.x86_64.rpm \
            dist/KPI=/usr/local/bin/kpi
            
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KPI-Linux
          path: release/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -oP '__version__ = "\K[^"]+' kiro_proxy/__init__.py)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build
        run: python build.py
        
      - name: Create packages
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path release
          
          # exe (standalone)
          Copy-Item dist/KPI.exe release/KPI-${VERSION}-windows-x86_64.exe
          
          # zip
          Compress-Archive -Path dist/KPI.exe -DestinationPath release/KPI-${VERSION}-windows-x86_64.zip
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KPI-Windows
          path: release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -oP '__version__ = "\K[^"]+' kiro_proxy/__init__.py || echo "1.0.0")
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Generate icon
        run: |
          mkdir -p assets/icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets/icon.png --out assets/icon.iconset/icon_${size}x${size}.png
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns
          
      - name: Build
        run: python build.py
        
      - name: Create packages
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p release
          
          # Binary (standalone)
          cp dist/KPI release/KPI-${VERSION}-macos-x86_64
          chmod +x release/KPI-${VERSION}-macos-x86_64
          
          # zip
          cd dist && zip -r ../release/KPI-${VERSION}-macos-x86_64.zip KPI && cd ..
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KPI-macOS
          path: release/*

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: List artifacts
        run: find artifacts -type f
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: KPI v${{ steps.version.outputs.VERSION }}
          body: |
            ## 下载
            
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | **Linux** | `KPI-${{ steps.version.outputs.VERSION }}-linux-x86_64` | 独立二进制文件 |
            | | `KPI-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz` | 压缩存档 |
            | | `kpi_${{ steps.version.outputs.VERSION }}_amd64.deb` | Debian/Ubuntu 包 |
            | | `kpi-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm` | Fedora/RHEL/CentOS 包 |
            | **Windows** | `KPI-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe` | 独立可执行文件 |
            | | `KPI-${{ steps.version.outputs.VERSION }}-windows-x86_64.zip` | 压缩存档 |
            | **macOS** | `KPI-${{ steps.version.outputs.VERSION }}-macos-x86_64` | 独立二进制文件 |
            | | `KPI-${{ steps.version.outputs.VERSION }}-macos-x86_64.zip` | 压缩存档 |
            
            ## 快速开始
            
            请参考 [快速开始指南](https://github.com/petehsu/KiroProxy/blob/main/kiro_proxy/docs/01-quickstart.md) 了解如何使用。
            
            ## 功能特性
            
            - 多协议支持（OpenAI / Anthropic / Gemini）
            - 完整的工具调用支持
            - 多账户轮换和自动令牌刷新
            - Web UI 管理界面
            - 多语言支持（中文/英文）
            
            详见 [功能特性文档](https://github.com/petehsu/KiroProxy/blob/main/kiro_proxy/docs/02-features.md)
          files: |
            artifacts/KPI-Linux/*
            artifacts/KPI-Windows/*
            artifacts/KPI-macOS/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
